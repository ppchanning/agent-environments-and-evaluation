name: Add a source
description: Suggest simulation research or a supporting resource
title: "[source] "
body:
  - type: input
    id: url
    attributes:
      label: Original source URL
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevance and evidence
      description: Explain relevance to agent simulation, environment generation, or fidelity verification; include date, type, and limitations.
    validations:
      required: true
